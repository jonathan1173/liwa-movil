name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 3. Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. Instalar dependencias
        run: npm ci

      - name: 5. Crear archivo .env desde Secrets
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: 6. Obtener versión de Expo
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: 7. Compilar Android
        run: |
          npx expo prebuild
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 8. Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v${{ env.VERSION }}
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: 9. Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Liwa v${{ env.VERSION }}
          body: |
            ## Compilación automática

            **Versión:** v${{ env.VERSION }}

            **Commit:** ${{ github.sha }}

            APK generado automáticamente mediante GitHub Actions.
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}