name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main # O la rama que uses (por ejemplo: 'master')

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Instalar dependencias
        run: npm ci

      - name: 5. Crear archivo .env desde Secrets
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: 6. Compilar la app nativa en Android
        run: |
          npx expo prebuild
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 7. Subir el APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk